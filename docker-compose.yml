services:
  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - "--save"
      - "60"
      - "1"
      - "--loglevel"
      - "warning"
      - "--requirepass"
      - "nimda123!@#"
    restart: unless-stopped

volumes:
  redis-data:
